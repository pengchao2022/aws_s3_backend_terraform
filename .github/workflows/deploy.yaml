name: Deploy Terraform State Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        type: choice
        options:
          - dev
          - prod
        default: 'prod'

permissions:
  id-token: write
  contents: read

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'prod' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Terraform Init
        run: terraform init
        working-directory: ./terraform

      - name: Terraform Validate
        run: terraform validate
        working-directory: ./terraform

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -out=tfplan
        working-directory: ./terraform

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
        working-directory: ./terraform

      - name: Output resource info
        id: output
        run: |
          cd terraform
          echo "s3_bucket_name=$(terraform output -raw s3_bucket_name)" >> $GITHUB_OUTPUT
          echo "dynamodb_table_name=$(terraform output -raw dynamodb_table_name)" >> $GITHUB_OUTPUT
          echo "iam_policy_arn=$(terraform output -raw iam_policy_arn)" >> $GITHUB_OUTPUT

      - name: Display results
        run: |
          echo "✅ Terraform State Backend Successfully created!"
          echo "====================================="
          echo "S3 Bucket: ${{ steps.output.outputs.s3_bucket_name }}"
          echo "DynamoDB Table: ${{ steps.output.outputs.dynamodb_table_name }}"
          echo "IAM Policy ARN: ${{ steps.output.outputs.iam_policy_arn }}"
          echo "====================================="
          echo ""
          echo "use this in other projects:"
          echo ""
          cat << EOF
          terraform {
            backend "s3" {
              bucket         = "${{ steps.output.outputs.s3_bucket_name }}"
              key            = "your-project/terraform.tfstate"
              region         = "us-east-1"
              dynamodb_table = "${{ steps.output.outputs.dynamodb_table_name }}"
              encrypt        = true
            }
          }
          EOF

      - name: Save outputs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-outputs
          path: |
            terraform/terraform.tfstate*
          retention-days: 30